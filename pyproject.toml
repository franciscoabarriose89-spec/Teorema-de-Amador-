[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "amador-kernel"
version = "1700.0.0"
description = "Kernel de Amador — scientific computational core for the canonical Amador operator."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "Francisco Amador Barrios Espinoza" }
]
keywords = ["science", "geometry", "physics", "kernel", "amador", "research"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/franciscoabarriose89-spec/Teorema-de-Amador-"
Repository = "https://github.com/franciscoabarriose89-spec/Teorema-de-Amador-"
Issues = "https://github.com/franciscoabarriose89-spec/Teorema-de-Amador-/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
